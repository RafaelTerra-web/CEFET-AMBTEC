<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <style>
      .bg{fill:#d50000}
      .txt{fill:#fff;font-family:Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;font-weight:800}
    </style>
  </defs>
  <!-- fundo com cantos bem arredondados -->
  <rect class="bg" x="0" y="0" width="512" height="512" rx="112" ry="112"></rect>
  <!-- marca “h1” centralizada; ajuste fino de baseline -->
  <text class="txt" x="50%" y="58%" text-anchor="middle" font-size="280" letter-spacing="-10">h1</text>
</svg>
